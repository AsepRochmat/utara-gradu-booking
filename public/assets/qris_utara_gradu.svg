<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="100%" height="100%" style="background:#ffffff; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <clipPath id="qrCornerClip">
      <rect x="0" y="0" width="420" height="580" rx="20" ry="20" />
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="420" height="580" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top QRIS Official Header Bar -->
  <path d="M 0 18 Q 0 0 18 0 L 402 0 Q 420 0 420 18 L 420 82 L 0 82 Z" fill="#ffffff"/>
  
  <!-- Red Top Accent Line -->
  <rect x="0" y="0" width="420" height="6" fill="#ea2127"/>

  <!-- Official QRIS Logo Group -->
  <g transform="translate(145, 18)">
    <!-- QRIS Text Logo -->
    <text x="0" y="32" font-size="34" font-weight="900" fill="#1e293b" letter-spacing="-1">QRIS</text>
    <!-- Red Accent on Logo -->
    <path d="M 88 12 L 102 12 L 95 24 Z" fill="#ea2127"/>
    <text x="-40" y="48" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="1.2">QUICK RESPONSE CODE INDONESIAN STANDARD</text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="82" x2="396" y2="82" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Merchant Info -->
  <g transform="translate(210, 114)" text-anchor="middle">
    <text y="0" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="0.5">UTARA GRADU</text>
    <text y="19" font-size="11" font-weight="600" fill="#64748b">NMID : ID1026082120776</text>
    <text y="35" font-size="10.5" font-weight="600" fill="#059669">A01 - UTARA GRADUATION PHOTO STUDIO</text>
  </g>

  <!-- QR Code Container Box -->
  <rect x="45" y="165" width="330" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Realistic SVG QR Matrix Pattern -->
  <g transform="translate(65, 185)">
    <!-- Top-Left Position Detection Pattern (7x7) -->
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#0f172a"/>
    <rect x="10" y="10" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="20" y="20" width="30" height="30" rx="2" fill="#0f172a"/>

    <!-- Top-Right Position Detection Pattern (7x7) -->
    <rect x="220" y="0" width="70" height="70" rx="8" fill="#0f172a"/>
    <rect x="230" y="10" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="240" y="20" width="30" height="30" rx="2" fill="#0f172a"/>

    <!-- Bottom-Left Position Detection Pattern (7x7) -->
    <rect x="0" y="220" width="70" height="70" rx="8" fill="#0f172a"/>
    <rect x="10" y="230" width="50" height="50" rx="4" fill="#ffffff"/>
    <rect x="20" y="240" width="30" height="30" rx="2" fill="#0f172a"/>

    <!-- Alignment Pattern (Bottom-Right area) -->
    <rect x="210" y="210" width="50" height="50" rx="6" fill="#0f172a"/>
    <rect x="220" y="220" width="30" height="30" rx="3" fill="#ffffff"/>
    <rect x="230" y="230" width="10" height="10" fill="#0f172a"/>

    <!-- QR Data Matrix Dots Simulation -->
    <!-- Row 1 -->
    <rect x="85" y="10" width="10" height="20" fill="#0f172a"/>
    <rect x="110" y="10" width="20" height="10" fill="#0f172a"/>
    <rect x="145" y="0" width="10" height="30" fill="#0f172a"/>
    <rect x="170" y="10" width="30" height="10" fill="#0f172a"/>
    
    <!-- Row 2 -->
    <rect x="85" y="45" width="25" height="10" fill="#0f172a"/>
    <rect x="125" y="35" width="10" height="25" fill="#0f172a"/>
    <rect x="150" y="45" width="30" height="10" fill="#0f172a"/>
    <rect x="195" y="35" width="10" height="25" fill="#0f172a"/>

    <!-- Timing Patterns -->
    <rect x="75" y="30" width="135" height="6" fill="#0f172a" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 10"/>
    <rect x="30" y="75" width="6" height="135" fill="#0f172a" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 10"/>

    <!-- Middle Data Modules -->
    <rect x="85" y="80" width="30" height="30" fill="#0f172a"/>
    <rect x="130" y="75" width="20" height="15" fill="#0f172a"/>
    <rect x="165" y="85" width="35" height="20" fill="#0f172a"/>
    <rect x="215" y="80" width="20" height="25" fill="#0f172a"/>
    <rect x="250" y="90" width="30" height="15" fill="#0f172a"/>

    <rect x="0" y="90" width="20" height="30" fill="#0f172a"/>
    <rect x="35" y="100" width="25" height="20" fill="#0f172a"/>
    <rect x="80" y="125" width="20" height="20" fill="#0f172a"/>
    <rect x="115" y="110" width="35" height="15" fill="#0f172a"/>
    <rect x="170" y="120" width="25" height="30" fill="#0f172a"/>
    <rect x="210" y="115" width="40" height="20" fill="#0f172a"/>
    <rect x="265" y="120" width="25" height="25" fill="#0f172a"/>

    <rect x="0" y="140" width="35" height="20" fill="#0f172a"/>
    <rect x="50" y="135" width="15" height="30" fill="#0f172a"/>
    <rect x="85" y="160" width="25" height="30" fill="#0f172a"/>
    <rect x="130" y="145" width="25" height="20" fill="#0f172a"/>
    <rect x="175" y="165" width="20" height="25" fill="#0f172a"/>
    <rect x="215" y="150" width="30" height="20" fill="#0f172a"/>
    <rect x="260" y="160" width="25" height="30" fill="#0f172a"/>

    <rect x="15" y="180" width="30" height="25" fill="#0f172a"/>
    <rect x="85" y="205" width="35" height="15" fill="#0f172a"/>
    <rect x="135" y="185" width="20" height="35" fill="#0f172a"/>
    <rect x="170" y="205" width="30" height="20" fill="#0f172a"/>
    <rect x="215" y="185" width="25" height="15" fill="#0f172a"/>
    <rect x="255" y="205" width="35" height="20" fill="#0f172a"/>

    <rect x="85" y="240" width="30" height="25" fill="#0f172a"/>
    <rect x="130" y="235" width="25" height="35" fill="#0f172a"/>
    <rect x="175" y="240" width="30" height="25" fill="#0f172a"/>
    <rect x="270" y="240" width="20" height="35" fill="#0f172a"/>
    <rect x="95" y="275" width="40" height="15" fill="#0f172a"/>
    <rect x="155" y="270" width="35" height="20" fill="#0f172a"/>
    <rect x="210" y="275" width="30" height="15" fill="#0f172a"/>
    <rect x="255" y="270" width="25" height="20" fill="#0f172a"/>

    <!-- Center QRIS Badge Icon -->
    <rect x="120" y="120" width="50" height="50" rx="8" fill="#ffffff" stroke="#ea2127" stroke-width="2.5"/>
    <text x="145" y="144" font-size="13" font-weight="900" fill="#ea2127" text-anchor="middle">QRIS</text>
    <text x="145" y="158" font-size="7.5" font-weight="800" fill="#1e293b" text-anchor="middle">INDONESIA</text>
  </g>

  <!-- Scan & Pay Banner Tagline -->
  <g transform="translate(210, 514)" text-anchor="middle">
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
    <text y="3" font-size="11" font-weight="800" fill="#0f172a" letter-spacing="0.5">SATU QR UNTUK SEMUA PEMBAYARAN</text>
  </g>

  <!-- Supported Payment Partner Logos Footer -->
  <g transform="translate(210, 550)" text-anchor="middle">
    <text y="0" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="0.3">
      BCA Mobile • Mandiri • BRImo • BNI • GoPay • OVO • DANA • ShopeePay
    </text>
    <text y="14" font-size="8.5" font-weight="600" fill="#94a3b8">
      Dicetak resmi oleh UTARA GRADU (@utara.photo)
    </text>
  </g>
</svg>
