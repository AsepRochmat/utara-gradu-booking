<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="terracottaGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c04945" />
      <stop offset="100%" stop-color="#a33633" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.3)" />
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;display=swap');
    </style>
  </defs>
  <!-- Background circle with terracotta gradient -->
  <circle cx="300" cy="300" r="288" fill="url(#terracottaGrad)" />
  <!-- UTARA text with elegant Didone serif matching reference image -->
  <text
    x="300"
    y="365"
    text-anchor="middle"
    font-family="'Cormorant Garamond', 'Bodoni Moda', 'Didot', 'Playfair Display', Georgia, serif"
    font-weight="700"
    font-size="155"
    letter-spacing="8"
    fill="#ffffff"
    filter="url(#softShadow)"
  >UTARA</text>
</svg>