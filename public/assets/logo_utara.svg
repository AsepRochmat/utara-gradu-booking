<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="terracottaGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c04945" />
      <stop offset="100%" stop-color="#a33633" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>
  <!-- Background circle with terracotta gradient -->
  <circle cx="300" cy="300" r="288" fill="url(#terracottaGrad)" />
  <!-- Subtle white border ring -->
  <circle cx="300" cy="300" r="278" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" />
  <!-- HD crisp UTARA text - clean vector, not traced paths -->
  <text
    x="300"
    y="362"
    text-anchor="middle"
    font-family="Inter, Montserrat, Arial Black, sans-serif"
    font-weight="900"
    font-size="148"
    letter-spacing="10"
    fill="#ffffff"
    filter="url(#softShadow)"
  >UTARA</text>
</svg>